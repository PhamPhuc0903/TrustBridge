name: trustbridge-windows-demo
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustbridge
      POSTGRES_PASSWORD: trustbridge_demo
      POSTGRES_DB: trustbridge
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - trustbridge_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustbridge -d trustbridge"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  trustbridge_pg_data:
